version: "2"

run:
  timeout: 5m
  tests: false

formatters:
  enable:
    - gci
    - goimports

  settings:
    gci:
      sections:
        - standard
        - default

linters:
  enable:
    - cyclop
    - errname
    - exhaustive
    - funlen
    - gocognit
    - goconst
    - gocritic
    - godot
    - gosec
    - lll
    - loggercheck
    - makezero
    - nakedret
    - nolintlint
    - predeclared
    - reassign
    - staticcheck
    - unconvert
    - unparam
    - usestdlibvars
    - whitespace

  settings:
    cyclop:
      max-complexity: 30
      package-average: 10.0

    errcheck:
      check-type-assertions: true

    exhaustive:
      check:
        - switch
        - map

    funlen:
      lines: 150
      statements: 80

    gocognit:
      min-complexity: 40

    gosec:
      excludes:
        - G117
        - G304
        - G401
        - G501

    govet:
      enable-all: true
      disable:
        - fieldalignment
      settings:
        shadow:
          # Non-strict mode allows the idiomatic `if err := ...; err != nil` pattern
          # to shadow an outer err without flagging every occurrence.
          strict: false

    nakedret:
      max-func-lines: 10

    lll:
      line-length: 180

    staticcheck:
      checks: ["all", "-SA1019"]

  exclusions:
    paths:
      - tests
    rules:
      # Test-support helpers: cleanup paths intentionally ignore os.RemoveAll / os.Unsetenv errors.
      - path: pkg/testutils/
        linters:
          - errcheck
          - gosec
      # PickClosestUrls is intentionally complex — the semver selection logic doesn't split cleanly.
      - path: pkg/models/all_urls\.go
        linters:
          - gocognit
        text: PickClosestUrls
      # sqliteSetup is a dormant test helper kept for future SQLite-backed test paths.
      - path: pkg/models/common\.go
        linters:
          - unused
        text: sqliteSetup