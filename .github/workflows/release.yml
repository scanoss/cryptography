name: Release
# Build and attach supported artifacts a draft release tag

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Get tags to allow build script to get build version

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Install the arm64 cgo toolchain
        # The DuckDB driver is a cgo binding, so the arm64 build cross-compiles C and C++.
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build
        run: |
          make build_amd
          CC=aarch64-linux-gnu-gcc CXX=aarch64-linux-gnu-g++ make build_arm

      - name: Unit Test
        run: make unit_test

      - name: Package
        run: |
          make package_amd
          CC=aarch64-linux-gnu-gcc CXX=aarch64-linux-gnu-g++ make package_arm

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          files: |
            target/scanoss-cryptography-api-linux-amd64
            target/scanoss-cryptography-api-linux-arm64
            scanoss-cryptography-api_linux-amd64_${{ github.ref_name }}-1.tgz
            scanoss-cryptography-api_linux-arm64_${{ github.ref_name }}-1.tgz
