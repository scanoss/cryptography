name: Golang CI Lint
# This workflow will run the golangci-lint analysis

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Get tags to allow build script to get build version

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Setup Version
        run: make version

      - name: Read linter version from Makefile
        id: linter
        run: echo "version=$(grep '^LINTER_VERSION' Makefile | cut -d':' -f2 | tr -d '= ')" >> "$GITHUB_OUTPUT"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.linter.outputs.version }}
          args: --timeout=5m

